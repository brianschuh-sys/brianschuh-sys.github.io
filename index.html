<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zone Defense Trainer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap');

  :root{
    --turf:#1c8a4f;
    --turf-dark:#187a46;
    --ink:#12181a;
    --panel:#0f1a17;
    --panel-2:#15241f;
    --line-white:rgba(255,255,255,0.92);
    --hash:#f2c14e;
    --ball:#e8452c;
    --ball-dark:#b8331f;
    --off:#f2934a;
    --off-dark:#c96e2b;
    --def:#2f9bd6;
    --def-dark:#1f6f9c;
    --paper:#f4efe3;
    --muted:#9fb0ab;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink);
    color:var(--paper);
    font-family:'Barlow', sans-serif;
  }

  .app{
    display:flex;
    min-height:100vh;
    flex-wrap:wrap;
  }

  .app-minimal{
    display:flex;
    height:100vh;
    align-items:center;
    justify-content:center;
    padding:16px;
    overflow:hidden;
  }
  .app-minimal .field-card{
    width:100%;
    max-width:920px;
    display:flex;
    flex-direction:column;
    align-items:center;
    max-height:100%;
  }
  .field-card .field-title-row{ width:100%; }
  .minimal-controls{ margin-top:16px; }

  .attacker-counter{
    display:inline-flex;
    align-items:center;
    gap:9px;
  }
  button.ctl.round{
    width:26px;
    height:26px;
    padding:0;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    line-height:1;
    font-weight:700;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:340px;
    flex-shrink:0;
    background:var(--panel);
    padding:28px 26px 32px;
    border-right:1px solid rgba(255,255,255,0.06);
  }
  .eyebrow{
    font-family:'Barlow Condensed', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.18em;
    font-size:12px;
    color:var(--hash);
    font-weight:600;
    margin:0 0 6px;
  }
  h1{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    font-size:34px;
    line-height:1.02;
    margin:0 0 14px;
    letter-spacing:-0.01em;
  }
  .lede{
    font-size:15px;
    line-height:1.55;
    color:var(--muted);
    margin:0 0 26px;
  }
  .lede b{ color:var(--paper); font-weight:600; }

  .principles{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:26px;
  }
  .principle{
    background:var(--panel-2);
    border-radius:10px;
    padding:12px 14px;
    border-left:3px solid var(--def);
  }
  .principle h3{
    font-family:'Barlow Condensed', sans-serif;
    font-size:16px;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:0.01em;
  }
  .principle p{
    font-size:13px;
    line-height:1.45;
    color:var(--muted);
    margin:0;
  }
  .principle.p1{ border-left-color:var(--def); }
  .principle.p2{ border-left-color:var(--off); }
  .principle.p3{ border-left-color:var(--ball); }
  .principle.p4{ border-left-color:var(--hash); }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:26px;
  }
  button.ctl{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:600;
    letter-spacing:0.03em;
    font-size:14px;
    background:var(--panel-2);
    color:var(--paper);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:7px;
    padding:9px 14px;
    cursor:pointer;
    transition:background 0.15s ease, transform 0.1s ease;
  }
  button.ctl:hover{ background:#1c2f28; }
  button.ctl:active{ transform:scale(0.97); }
  button.ctl:disabled{ opacity:0.35; cursor:not-allowed; }
  button.ctl.wide{ flex:1 1 100%; }

  .toggle-row{
    display:flex; align-items:center; gap:8px;
    font-size:13px; color:var(--muted);
    margin-bottom:8px;
  }
  .toggle-row input{ accent-color:var(--def); }

  .legend{
    display:flex; flex-direction:column; gap:9px;
    padding-top:18px; border-top:1px solid rgba(255,255,255,0.08);
  }
  .legend-item{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }
  .swatch{ width:14px; height:14px; border-radius:50%; flex-shrink:0; border:2px solid rgba(255,255,255,0.5);}
  .swatch.ball{ background:var(--ball); }
  .swatch.off{ background:var(--off); }
  .swatch.def{ background:var(--def); }
  .swatch.ring{ background:transparent; border:2px solid var(--ball); }

  /* ---------- Field area ---------- */
  .field-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
    min-width:320px;
  }
  .field-card{
    width:100%;
    max-width:920px;
  }
  .field-title-row{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    margin-bottom:10px;
  }
  .field-title-row .status{
    font-family:'Barlow Condensed', sans-serif;
    font-size:14px;
    color:var(--muted);
    letter-spacing:0.02em;
    justify-self:end;
  }
  .field-title-row .status b{ color:var(--hash); }

  .menu-wrap{ position:relative; justify-self:center; display:flex; align-items:center; gap:9px; }
  #menuBtn{ font-size:15px; }
  .mode-label{
    font-family:'Barlow Condensed', sans-serif;
    font-size:14px;
    font-weight:600;
    color:var(--hash);
    letter-spacing:0.02em;
    white-space:nowrap;
  }
  .menu-dropdown{
    display:none;
    position:absolute;
    top:calc(100% + 8px);
    left:50%;
    transform:translateX(-50%);
    background:var(--panel-2);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:9px;
    padding:6px;
    box-shadow:0 12px 28px rgba(0,0,0,0.5);
    z-index:10;
    white-space:nowrap;
  }
  .menu-dropdown.open{ display:block; }
  .menu-item{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:var(--paper);
    font-family:'Barlow Condensed', sans-serif;
    font-size:14px;
    font-weight:600;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
  }
  .menu-item:hover{ background:rgba(255,255,255,0.08); }
  .menu-item.active{ color:var(--hash); }
  .menu-item.active::before{ content:'\2713  '; }

  svg#field{
    width:100%;
    height:auto;
    aspect-ratio: 880 / 760;
    display:block;
    border-radius:14px;
    box-shadow:0 18px 40px rgba(0,0,0,0.45);
    touch-action:none;
    cursor:default;
  }

  .token{ cursor:grab; touch-action:none; }
  .token:active{ cursor:grabbing; }

  .defender-token{
    transition: transform 0.2s ease-out;
  }

  .hint{
    margin-top:10px;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.4;
    text-align:center;
  }

  @media (max-width: 860px){
    .sidebar{ width:100%; border-right:none; border-bottom:1px solid rgba(255,255,255,0.06); }
    .app{ flex-direction:column; }
  }
</style>
</head>
<body>

<div class="app-minimal">
  <div class="field-card">
    <div class="field-title-row">
      <span class="eyebrow" style="margin:0; justify-self:start;">DEFENSE TRAINER</span>
      <span class="menu-wrap">
        <button class="ctl round" id="menuBtn" aria-label="Defense scheme menu">&#9776;</button>
        <span id="modeLabel" class="mode-label">Man to Man</span>
        <div class="menu-dropdown" id="menuDropdown">
          <button class="menu-item active" data-mode="man">Man to Man</button>
          <button class="menu-item" data-mode="boxAndOne">Box and 1</button>
        </div>
      </span>
      <span class="status attacker-counter">
        <button class="ctl round" id="addBtn" aria-label="Add attacker">+</button>
        Attackers: <b id="countLabel">4</b>
        <button class="ctl round" id="removeBtn" aria-label="Remove attacker">&minus;</button>
      </span>
    </div>
    <svg id="field" viewBox="0 0 880 760" xmlns="http://www.w3.org/2000/svg"></svg>
    <p class="hint">Drag any dot to move it. Click (don't drag) an orange dot to give it the ball.</p>
  </div>
</div>

<script>
(function(){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('field');

  // ---- coordinate system: yards. Goal at (0,0). +y = upfield (away from goal). ----
  const PX_PER_YD = 20;
  const ORIGIN_X = 440;   // px, where x=0 yd sits
  const ORIGIN_Y = 440;   // px, where y=0 yd (goal line) sits
  const FIELD_X = [-21, 21];   // yd
  const FIELD_Y = [-15, 21];   // yd (15 yd behind the goal, standard field depth)

  function toPx(pt){ return { x: ORIGIN_X + pt.x*PX_PER_YD, y: ORIGIN_Y - pt.y*PX_PER_YD }; }
  function toYd(px, py){ return { x: (px-ORIGIN_X)/PX_PER_YD, y: (ORIGIN_Y-py)/PX_PER_YD }; }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function lerp(a,b,t){ return { x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t }; }
  function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }

  function el(tag, attrs){
    const e = document.createElementNS(NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // ---------------- static field layer ----------------
  const staticLayer = el('g', {id:'staticLayer'});
  svg.appendChild(staticLayer);

  function buildField(){
    staticLayer.innerHTML = '';

    const w = 880, h = 760;
    // background turf
    staticLayer.appendChild(el('rect', {x:0,y:0,width:w,height:h,fill:'#1c8a4f'}));
    // subtle vertical shading bands for depth
    const grad = el('linearGradient', {id:'turfGrad', x1:'0', y1:'0', x2:'0', y2:'1'});
    grad.appendChild(el('stop', {offset:'0%', 'stop-color':'#1f974f'}));
    grad.appendChild(el('stop', {offset:'100%', 'stop-color':'#187a46'}));
    const defs = el('defs', {});
    defs.appendChild(grad);
    staticLayer.appendChild(defs);
    staticLayer.appendChild(el('rect', {x:0,y:0,width:w,height:h,fill:'url(#turfGrad)'}));

    // 5-yard grid lines
    for(let y = FIELD_Y[0]; y <= FIELD_Y[1]; y += 5){
      const p1 = toPx({x:FIELD_X[0], y}), p2 = toPx({x:FIELD_X[1], y});
      const bold = (Math.abs(y-10) < 0.01 || Math.abs(y-15)<0.01);
      staticLayer.appendChild(el('line', {
        x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y,
        stroke: bold ? 'rgba(15,60,120,0.85)' : 'rgba(20,75,145,0.65)',
        'stroke-width': bold ? 2 : 1,
        'stroke-dasharray': '5 5'
      }));
    }
    for(let x = -20; x <= 20; x += 5){
      const p1 = toPx({x, y:FIELD_Y[0]}), p2 = toPx({x, y:FIELD_Y[1]});
      staticLayer.appendChild(el('line', {
        x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y,
        stroke:'rgba(20,75,145,0.55)', 'stroke-width':1, 'stroke-dasharray':'5 5'
      }));
    }

    // hash marks (yellow) at x = -9, +9
    [-9, 9].forEach(hx=>{
      const p1 = toPx({x:hx, y:FIELD_Y[0]}), p2 = toPx({x:hx, y:FIELD_Y[1]});
      staticLayer.appendChild(el('line', {
        x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y,
        stroke:'#f2c14e', 'stroke-width':3, 'stroke-dasharray':'10 8', opacity:0.9
      }));
    });

    // goal line (white dashed, full width)
    {
      const p1 = toPx({x:FIELD_X[0], y:0}), p2 = toPx({x:FIELD_X[1], y:0});
      staticLayer.appendChild(el('line', {
        x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y,
        stroke:'rgba(255,255,255,0.85)', 'stroke-width':2, 'stroke-dasharray':'9 7'
      }));
    }

    // crease circle (radius 3 yd), green fill so grid doesn't show through, white outline
    const creaseC = toPx({x:0,y:0});
    const creaseR = 3*PX_PER_YD;
    staticLayer.appendChild(el('circle', {cx:creaseC.x, cy:creaseC.y, r:creaseR, fill:'#1c8a4f'}));
    staticLayer.appendChild(el('circle', {cx:creaseC.x, cy:creaseC.y, r:creaseR, fill:'none', stroke:'#ffffff', 'stroke-width':3}));
    // redraw goal-line-extended dashes across the crease interior
    {
      const y0 = creaseC.y;
      const xStart = creaseC.x - creaseR + 3, xEnd = creaseC.x + creaseR - 3;
      const dash=7, gap=6;
      let x = xStart;
      while(x < xEnd){
        const x2 = Math.min(x+dash, xEnd);
        staticLayer.appendChild(el('line', {x1:x,y1:y0,x2:x2,y2:y0, stroke:'#ffffff', 'stroke-width':2}));
        x += dash+gap;
      }
    }

    // goal mouth (red), 2 yd wide, centered at 0,0
    {
      const gp1 = toPx({x:-1, y:0}), gp2 = toPx({x:1, y:0});
      staticLayer.appendChild(el('line', {x1:gp1.x,y1:gp1.y,x2:gp2.x,y2:gp2.y, stroke:'#d23a24', 'stroke-width':6, 'stroke-linecap':'round'}));
    }

    // field border
    staticLayer.appendChild(el('rect', {x:1,y:1,width:w-2,height:h-2, fill:'none', stroke:'rgba(255,255,255,0.3)', 'stroke-width':2}));

    // solid white boundary lines: the offensive box (side boards) and the endline (behind the goal)
    {
      const topLeft = toPx({x:FIELD_X[0], y:20});
      const botLeft = toPx({x:FIELD_X[0], y:FIELD_Y[0]});
      const topRight = toPx({x:FIELD_X[1], y:20});
      const botRight = toPx({x:FIELD_X[1], y:FIELD_Y[0]});
      // side boards (offensive box)
      staticLayer.appendChild(el('line', {x1:topLeft.x, y1:topLeft.y, x2:botLeft.x, y2:botLeft.y, stroke:'#ffffff', 'stroke-width':4, 'stroke-linecap':'round'}));
      staticLayer.appendChild(el('line', {x1:topRight.x, y1:topRight.y, x2:botRight.x, y2:botRight.y, stroke:'#ffffff', 'stroke-width':4, 'stroke-linecap':'round'}));
      // endline (behind the goal)
      staticLayer.appendChild(el('line', {x1:botLeft.x, y1:botLeft.y, x2:botRight.x, y2:botRight.y, stroke:'#ffffff', 'stroke-width':4, 'stroke-linecap':'round'}));
      // top of the box, 20 yd from the goal
      const topL20 = toPx({x:FIELD_X[0], y:20});
      const topR20 = toPx({x:FIELD_X[1], y:20});
      staticLayer.appendChild(el('line', {x1:topL20.x, y1:topL20.y, x2:topR20.x, y2:topR20.y, stroke:'#ffffff', 'stroke-width':4, 'stroke-linecap':'round'}));
    }

    // "the paint": 3-10 yd in front of goal, 5 yd either side
    {
      const tl = toPx({x:-PAINT.xHalf, y:PAINT.yFar});
      const br = toPx({x:PAINT.xHalf, y:PAINT.yNear});
      const g = el('g', {id:'paintZone'});
      g.appendChild(el('rect', {
        x:tl.x, y:tl.y, width:(br.x-tl.x), height:(br.y-tl.y),
        fill:'rgba(242,193,78,0.10)', stroke:'rgba(242,193,78,0.65)',
        'stroke-width':2, 'stroke-dasharray':'8 6'
      }));
      // inner 5x5 yd collapse box
      const midY = (PAINT.yNear+PAINT.yFar)/2;
      const itl = toPx({x:-2.5, y:midY+2.5});
      const ibr = toPx({x:2.5, y:midY-2.5});
      g.appendChild(el('rect', {
        x:itl.x, y:itl.y, width:(ibr.x-itl.x), height:(ibr.y-itl.y),
        fill:'none', stroke:'rgba(242,193,78,0.4)',
        'stroke-width':1.5, 'stroke-dasharray':'3 4'
      }));
      staticLayer.appendChild(g);
    }

    // "10" / "15" yard labels near right edge
    [10,15].forEach(yd=>{
      const p = toPx({x:FIELD_X[1]-1.2, y:yd});
      const t = el('text', {x:p.x, y:p.y+4, fill:'rgba(255,255,255,0.55)', 'font-size':'12', 'font-family':"'Barlow Condensed', sans-serif", 'text-anchor':'end'});
      t.textContent = yd + ' yd';
      staticLayer.appendChild(t);
    });
  }

  // ---------------- dynamic layer (lanes + tokens) ----------------
  const zoneLayer = el('g', {id:'zoneLayer'});
  const laneLayer = el('g', {id:'laneLayer'});
  const tokenLayer = el('g', {id:'tokenLayer'});
  const defenderLayer = el('g', {id:'defenderLayer'});
  const offenseLayer = el('g', {id:'offenseLayer'});
  svg.appendChild(zoneLayer);
  svg.appendChild(laneLayer);
  svg.appendChild(tokenLayer);
  tokenLayer.appendChild(defenderLayer);
  tokenLayer.appendChild(offenseLayer);

  // persistent defender DOM nodes, so their cx/cy transitions can animate smoothly
  let defenderNodes = [];
  function ensureDefenderNodes(n){
    while(defenderNodes.length < n){
      const g = el('g', {class:'defender-token'});
      const ring = el('circle', {cx:0, cy:0, r:15, fill:'none', stroke:'#e8452c', 'stroke-width':2.5, class:'onball-ring'});
      ring.style.display = 'none';
      const dot = el('circle', {cx:0, cy:0, r:11, fill:'#2f9bd6', stroke:'#123', 'stroke-width':1.5, class:'defender-dot'});
      const label = el('text', {x:0, y:4, 'text-anchor':'middle', 'font-size':'11', fill:'#fff', 'font-family':"'Barlow Condensed', sans-serif", 'font-weight':'700', class:'defender-label'});
      label.textContent = 'D';
      g.appendChild(ring); g.appendChild(dot); g.appendChild(label);
      defenderLayer.appendChild(g);
      defenderNodes.push({g, ring, dot, label});
    }
    while(defenderNodes.length > n){
      const node = defenderNodes.pop();
      node.g.remove();
    }
  }

  // persistent offense DOM nodes. These must NOT be destroyed/recreated during a drag —
  // mobile browsers tie touch tracking to the original element, so recreating it on every
  // pointermove (as re-rendering from scratch would) silently kills the drag on touchscreens.
  let offenseNodes = [];
  function ensureOffenseNodes(n){
    while(offenseNodes.length < n){
      const idx = offenseNodes.length;
      const g = el('g', {class:'token'});
      const hit = el('circle', {cx:0, cy:0, r:26, fill:'rgba(0,0,0,0.001)', 'pointer-events':'all'});
      const paintRing = el('circle', {cx:0, cy:0, r:17, fill:'none', stroke:'#f2c14e', 'stroke-width':2, 'stroke-dasharray':'3 3'});
      paintRing.style.display = 'none';
      const dot = el('circle', {cx:0, cy:0, r:13, stroke:'#3a1c0f', 'stroke-width':1.5});
      const label = el('text', {x:0, y:4, 'text-anchor':'middle', 'font-size':'11', fill:'#1b0f08', 'font-family':"'Barlow Condensed', sans-serif", 'font-weight':'700', 'pointer-events':'none'});
      g.appendChild(hit); g.appendChild(paintRing); g.appendChild(dot); g.appendChild(label);
      offenseLayer.appendChild(g);
      attachDrag(g, idx);
      offenseNodes.push({g, hit, paintRing, dot, label});
    }
    while(offenseNodes.length > n){
      const node = offenseNodes.pop();
      node.g.remove();
    }
  }

  // ---------------- state ----------------
  let offense = [
    {x:0,  y:9},   // top-center attacker (default: has the ball)
    {x:-11, y:5},  // left wing
    {x:11,  y:5},  // right wing
    {x:-7,  y:1.5} // low / X attackman
  ];
  let ballIndex = 0;

  const GOAL = {x:0, y:0};
  const SAG_RANGE = 16;
  const MIN_SAG = 0.12;
  const MAX_SAG = 0.72;
  const CREASE_BUFFER = 3.3; // offensive players may not enter the crease
  const FAR_THRESHOLD = 20; // yd from ball -> collapse to the inner box instead of the paint edge

  // "The paint": 3-10 yd in front of goal (top of crease extended, out to 10 yd), 5 yd either side
  const PAINT = { xHalf: 5, yNear: 3, yFar: 12 };
  function inPaint(pt){
    return pt.x >= -PAINT.xHalf && pt.x <= PAINT.xHalf && pt.y >= PAINT.yNear && pt.y <= PAINT.yFar;
  }
  function nearestRectPoint(pt, rect){
    return { x: clamp(pt.x, -rect.xHalf, rect.xHalf), y: clamp(pt.y, rect.yNear, rect.yFar) };
  }

  // Inner 5x5 yd box, centered in the paint - the deepest a weak-side defender collapses to.
  const paintMidY = (PAINT.yNear + PAINT.yFar) / 2;
  const INNER_BOX = { xHalf: 2.5, yNear: paintMidY - 2.5, yFar: paintMidY + 2.5 };

  // ---------------- defensive scheme ----------------
  let defenseMode = 'man'; // 'man' | 'boxAndOne'

  // The "fan": 15 yd from goal, +/-60 deg off dead-center (matches the shot-quality diagram).
  const FAN_R = 15;
  const FAN_HALF_ANGLE = Math.PI/3; // 60 deg
  function fanClamp(pt){
    const dx = pt.x-GOAL.x, dy = pt.y-GOAL.y;
    const r = Math.hypot(dx,dy);
    if(r < 0.0001) return {x:GOAL.x, y:GOAL.y};
    // In this coordinate system +y is already "upfield / away from goal", so straight-ahead is angle 0.
    let angle = Math.atan2(dx, dy);
    angle = clamp(angle, -FAN_HALF_ANGLE, FAN_HALF_ANGLE);
    const rc = Math.min(r, FAN_R);
    return { x: GOAL.x + rc*Math.sin(angle), y: GOAL.y + rc*Math.cos(angle) };
  }

  // Box-and-1: 4 zone defenders anchored at the corners of the paint, plus one inside
  // (help/lock-off) defender. Returns an array of 5 {pos, engaged}, in order [TL,TR,BL,BR,Inside].
  const BOX_TOP = 20; // the "top of box" boundary line - the offensive box's far edge
  // Detection zone reaches the top of the box; how far the inside defender actually
  // approaches is separately capped at FAN_R (15 yd) below.
  const TOP_CENTER = { xHalf: INNER_BOX.xHalf, yNear: PAINT.yFar, yFar: BOX_TOP };

  // Each zone defender is hard-confined to their own rectangle - they can never cross
  // into a neighboring zone, no matter what the ball carrier does.
  const ZONE_BOUNDS = {
    TL: { xMin:FIELD_X[0], xMax:0, yMin:paintMidY, yMax:FAN_R },
    TR: { xMin:0, xMax:FIELD_X[1], yMin:paintMidY, yMax:FAN_R },
    BL: { xMin:FIELD_X[0], xMax:0, yMin:PAINT.yNear, yMax:paintMidY },
    BR: { xMin:0, xMax:FIELD_X[1], yMin:PAINT.yNear, yMax:paintMidY }
  };
  function clampToZone(pos, key){
    const z = ZONE_BOUNDS[key];
    return { x: clamp(pos.x, z.xMin, z.xMax), y: clamp(pos.y, z.yMin, z.yMax) };
  }

  // Which quadrant of the whole offensive box a point falls in - used both for the
  // ball carrier and for checking whether an off-ball attacker is "in someone's zone".
  function zoneOf(pt){
    if(pt.y > BOX_TOP) return 'outside';
    if(pt.y < 0) return 'behind';
    return (pt.y >= paintMidY) ? (pt.x < 0 ? 'TL' : 'TR') : (pt.x < 0 ? 'BL' : 'BR');
  }

  const DIAGONAL = { TL:'BR', TR:'BL', BL:'TR', BR:'TL' };

  function computeBoxAndOne(offense, ballIndex){
    const ball = offense[ballIndex];
    const homes = {
      TL: {x:-PAINT.xHalf, y:PAINT.yFar},
      TR: {x: PAINT.xHalf, y:PAINT.yFar},
      BL: {x:-PAINT.xHalf, y:PAINT.yNear},
      BR: {x: PAINT.xHalf, y:PAINT.yNear}
    };
    const innerCorners = {
      TL: {x:-INNER_BOX.xHalf, y:INNER_BOX.yFar},
      TR: {x: INNER_BOX.xHalf, y:INNER_BOX.yFar},
      BL: {x:-INNER_BOX.xHalf, y:INNER_BOX.yNear},
      BR: {x: INNER_BOX.xHalf, y:INNER_BOX.yNear}
    };
    // Default: everyone sits home unless a rule below says otherwise.
    const targets = { TL:homes.TL, TR:homes.TR, BL:homes.BL, BR:homes.BR };
    const engaged = { TL:false, TR:false, BL:false, BR:false };

    const occupants = offense.filter(o => inPaint(o));
    const multiplePaint = occupants.length > 1;
    const inTopCenter = Math.abs(ball.x) <= TOP_CENTER.xHalf && ball.y > TOP_CENTER.yNear && ball.y <= TOP_CENTER.yFar;
    const ballZone = zoneOf(ball);

    if(ballZone === 'outside'){
      // Ball is beyond the top of the box - nobody responds to it. Everyone stays home.
    } else if(ballZone === 'behind'){
      // ROTATION: as the ball approaches GLE from behind the goal, the defense rotates
      // so that by the moment it crosses (y=0) everyone is already in the "engaging at
      // the bottom of the paint" configuration - not after.
      const side = ball.x < 0 ? 'L' : 'R';
      const ROTATE_DEPTH = 3; // yards behind GLE over which the rotation plays out
      const t = clamp((ball.y + ROTATE_DEPTH) / ROTATE_DEPTH, 0, 1); // 0 = deep behind, 1 = at GLE
      const ballSideBottom = side === 'L' ? 'BL' : 'BR';
      const oppBottom      = side === 'L' ? 'BR' : 'BL';
      const ballSideTop     = side === 'L' ? 'TL' : 'TR';
      const oppTop          = side === 'L' ? 'TR' : 'TL';

      // Ball-side bottom defender: stays on the off-ball attacker in his zone the whole time.
      {
        const zoneMates = offense.filter((o,i) => i !== ballIndex && zoneOf(o) === ballSideBottom);
        if(zoneMates.length > 0){
          let best = null, bestScore = Infinity;
          zoneMates.forEach(o=>{
            const score = Math.abs(o.y) + Math.abs(o.x);
            if(score < bestScore){ bestScore = score; best = o; }
          });
          targets[ballSideBottom] = clampToZone({ x: homes[ballSideBottom].x, y: best.y }, ballSideBottom);
          engaged[ballSideBottom] = true;
        }
      }
      // Opposite bottom defender: rotates over from his home corner toward bottom-center
      // of the paint, looking to engage the ball carrier there.
      {
        const homeX = homes[oppBottom].x;
        const p = lerp({x:homeX, y:PAINT.yNear}, {x:0, y:PAINT.yNear}, t);
        targets[oppBottom] = clampToZone(p, oppBottom);
        engaged[oppBottom] = t > 0.02;
      }
      // Ball-side top defender: rotates in sync, from his inner-box corner over to where
      // the TL/TR split line meets the top of the inner box.
      {
        const p = lerp(innerCorners[ballSideTop], {x:0, y:INNER_BOX.yFar}, t);
        targets[ballSideTop] = clampToZone(p, ballSideTop);
      }
      // Opposite top defender: rotates in sync, down from his inner-box corner to where
      // the top/bottom split line meets his side of the inner box.
      {
        const ownSideX = oppTop === 'TR' ? INNER_BOX.xHalf : -INNER_BOX.xHalf;
        const p = lerp(innerCorners[oppTop], {x:ownSideX, y:paintMidY}, t);
        targets[oppTop] = clampToZone(p, oppTop);
      }
    } else if(inTopCenter && !multiplePaint){
      // Top-center lane is the inside defender's alone - all 4 outer defenders pinch
      // to the corners of the inner box.
      targets.TL = innerCorners.TL;
      targets.TR = innerCorners.TR;
      targets.BL = innerCorners.BL;
      targets.BR = innerCorners.BR;
    } else {
      // Normal case: the ball carrier's zone defender engages, and the diagonally
      // opposite defender pinches in to the inner box's matching corner.
      targets[ballZone] = clampToZone(fanClamp(ball), ballZone);
      engaged[ballZone] = true;
      const diag = DIAGONAL[ballZone];
      targets[diag] = innerCorners[diag];
    }

    // Inside (help/lock-off) defender.
    // Priority: if more than one attacker is in the paint, always lock off the paint
    // (centered on them) - this overrides everything else, even a ball carrier up top.
    // Otherwise, pick up the ball carrier if they're in the top-center lane.
    // Otherwise, lock onto the single attacker in the paint, if any.
    // Otherwise, hold the default home spot.
    let insideTarget, insideEngaged;

    if(multiplePaint){
      insideTarget = {
        x: occupants.reduce((s,o)=>s+o.x,0)/occupants.length,
        y: occupants.reduce((s,o)=>s+o.y,0)/occupants.length
      };
      insideEngaged = true;
    } else if(inTopCenter){
      insideTarget = { x: clamp(ball.x, -TOP_CENTER.xHalf, TOP_CENTER.xHalf), y: Math.min(ball.y, FAN_R) };
      insideEngaged = true;
    } else if(occupants.length === 1){
      const p = occupants[0];
      const dAB = dist(p, ball);
      if(dAB < 0.05){
        insideTarget = {x:p.x, y:p.y};
      } else {
        const dir = {x:(ball.x-p.x)/dAB, y:(ball.y-p.y)/dAB};
        const d = Math.min(1.1, dAB*0.45);
        insideTarget = {x:p.x+dir.x*d, y:p.y+dir.y*d};
      }
      insideEngaged = true;
    } else {
      insideTarget = {x:0, y:paintMidY};
      insideEngaged = false;
    }

    const result = [
      {pos:targets.TL, engaged:engaged.TL},
      {pos:targets.TR, engaged:engaged.TR},
      {pos:targets.BL, engaged:engaged.BL},
      {pos:targets.BR, engaged:engaged.BR},
      {pos:insideTarget, engaged:insideEngaged}
    ];
    // No box-and-1 defender ever plays below the bottom edge of the paint.
    result.forEach(d => { d.pos = {x:d.pos.x, y:Math.max(d.pos.y, PAINT.yNear)}; });
    return result;
  }

  function computeDefender(attacker, ball, isOnBall){
    let target;

    if(isOnBall){
      // On-ball defender: play the ball-you-goal line, tight pressure.
      const t = clamp(dist(attacker, ball) / SAG_RANGE, 0, 1); // ~0 since attacker === ball
      const sag = MIN_SAG + (MAX_SAG-MIN_SAG)*t;
      target = lerp(attacker, GOAL, sag);
    } else if(inPaint(attacker)){
      // Paint rule: play right next to your player, positioned between them and the ball.
      const dAB = dist(attacker, ball);
      const tightDist = 1.1; // yards off their hip
      if(dAB < 0.05){
        target = {x:attacker.x, y:attacker.y};
      } else {
        const dir = {x:(ball.x-attacker.x)/dAB, y:(ball.y-attacker.y)/dAB};
        const d = Math.min(tightDist, dAB*0.45);
        target = {x: attacker.x + dir.x*d, y: attacker.y + dir.y*d};
      }
    } else {
      // Off-ball, outside the paint: sag all the way to the nearest edge of the paint (minimum).
      // If their player is more than 20 yd from the ball, collapse further, to the edge of
      // the 5x5 yd box centered in the paint.
      const dBallMan = dist(attacker, ball);
      if(dBallMan > FAR_THRESHOLD){
        target = nearestRectPoint(attacker, INNER_BOX);
      } else {
        target = nearestRectPoint(attacker, PAINT);
      }
    }

    // defenders are allowed inside the crease (only offensive players are restricted there)
    // clamp to field
    target.x = clamp(target.x, FIELD_X[0]+1, FIELD_X[1]-1);
    target.y = clamp(target.y, FIELD_Y[0]+1, FIELD_Y[1]-1);
    return target;
  }

  function render(){
    laneLayer.innerHTML = '';
    zoneLayer.innerHTML = '';

    const ball = offense[ballIndex];

    // Box-and-1 zone demarcation lines (gray), color-matched labels for debugging/teaching.
    if(defenseMode === 'boxAndOne'){
      const ZC = { TL:'#8e44ad', TR:'#16a085', BL:'#2980b9', BR:'#e91e8c', inside:'#f1c40f' };
      const GRAY = '#9aa0a6';
      const lineOpts = { stroke:GRAY, 'stroke-width':1.5, 'stroke-dasharray':'6 5', opacity:0.6 };

      // left/right split (x = 0), from the goal out to the top of the box
      {
        const p1 = toPx({x:0, y:0}), p2 = toPx({x:0, y:FIELD_Y[1]});
        zoneLayer.appendChild(el('line', {x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y, ...lineOpts}));
      }
      // top/bottom split (y = paint mid)
      {
        const p1 = toPx({x:FIELD_X[0], y:paintMidY}), p2 = toPx({x:FIELD_X[1], y:paintMidY});
        zoneLayer.appendChild(el('line', {x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y, ...lineOpts}));
      }
      // top-center lane (inside defender's exclusive turf, unless the paint is crowded) -
      // detection reaches the top of the box; a dashed line marks the 15 yd approach cap.
      {
        const tl = toPx({x:-TOP_CENTER.xHalf, y:TOP_CENTER.yFar});
        const br = toPx({x:TOP_CENTER.xHalf, y:TOP_CENTER.yNear});
        zoneLayer.appendChild(el('rect', {
          x:tl.x, y:tl.y, width:(br.x-tl.x), height:(br.y-tl.y),
          fill:'rgba(154,160,166,0.08)', stroke:GRAY, 'stroke-width':1.5, 'stroke-dasharray':'6 5', opacity:0.75
        }));
        const capL = toPx({x:-TOP_CENTER.xHalf, y:FAN_R}), capR = toPx({x:TOP_CENTER.xHalf, y:FAN_R});
        zoneLayer.appendChild(el('line', {
          x1:capL.x, y1:capL.y, x2:capR.x, y2:capR.y,
          stroke:GRAY, 'stroke-width':1, 'stroke-dasharray':'2 4', opacity:0.9
        }));
      }
      // zone labels
      const labelPts = [
        {t:'TL', x:-PAINT.xHalf-1.5, y:paintMidY+3, c:ZC.TL},
        {t:'TR', x: PAINT.xHalf+1.5, y:paintMidY+3, c:ZC.TR},
        {t:'BL', x:-PAINT.xHalf-1.5, y:paintMidY-3, c:ZC.BL},
        {t:'BR', x: PAINT.xHalf+1.5, y:paintMidY-3, c:ZC.BR}
      ];
      labelPts.forEach(lp=>{
        const p = toPx({x:lp.x, y:lp.y});
        zoneLayer.appendChild(el('text', {
          x:p.x, y:p.y, 'text-anchor':'middle', 'font-size':'13', fill:lp.c,
          'font-family':"'Barlow Condensed', sans-serif", 'font-weight':'700', opacity:0.85
        })).textContent = lp.t;
      });
    }

    // shot lane: ball -> goal
    {
      const p1 = toPx(ball), p2 = toPx(GOAL);
      laneLayer.appendChild(el('line', {
        x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,
        stroke:'rgba(232,69,44,0.55)', 'stroke-width':2, 'stroke-dasharray':'6 6'
      }));
    }

    const defenders = defenseMode === 'man'
      ? offense.map((a,i) => ({pos: computeDefender(a, ball, i === ballIndex), engaged: i === ballIndex}))
      : computeBoxAndOne(offense, ballIndex);

    // denial lanes: defender -> their attacker (man-to-man only; zone assignments
    // don't map 1:1 to a single attacker in box-and-1)
    if(defenseMode === 'man'){
      defenders.forEach((d,i)=>{
        const p1 = toPx(d.pos), p2 = toPx(offense[i]);
        laneLayer.appendChild(el('line', {
          x1:p1.x,y1:p1.y,x2:p2.x,y2:p2.y,
          stroke:'rgba(255,255,255,0.4)', 'stroke-width':1.5, 'stroke-dasharray':'4 5'
        }));
      });
    }

    // defender tokens: update persistent nodes so their movement animates smoothly.
    // Exception: an "engaged" defender (on-ball man, or a zone defender actively
    // challenging the ball) snaps instantly, tracking the ball carrier with no delay.
    ensureDefenderNodes(defenders.length);
    const BOX_AND_ONE_COLORS = ['#8e44ad', '#16a085', '#2980b9', '#e91e8c', '#f1c40f']; // TL, TR, BL, BR, Inside
    defenders.forEach((d,i)=>{
      const p = toPx(d.pos);
      const node = defenderNodes[i];
      node.ring.style.display = d.engaged ? '' : 'none';
      node.g.style.transition = d.engaged ? 'none' : '';
      node.g.setAttribute('transform', `translate(${p.x} ${p.y})`);
      node.dot.setAttribute('fill', defenseMode === 'boxAndOne' ? BOX_AND_ONE_COLORS[i] : '#2f9bd6');
    });

    // offense tokens (draggable + clickable): update persistent nodes in place.
    ensureOffenseNodes(offense.length);
    offense.forEach((o,i)=>{
      const p = toPx(o);
      const isBall = (i === ballIndex);
      const node = offenseNodes[i];
      node.g.setAttribute('transform', `translate(${p.x} ${p.y})`);
      node.paintRing.style.display = (!isBall && inPaint(o)) ? '' : 'none';
      node.dot.setAttribute('fill', isBall ? '#e8452c' : '#f2934a');
      node.label.textContent = isBall ? 'B' : 'O';
    });

    document.getElementById('countLabel').textContent = offense.length;
    document.getElementById('removeBtn').disabled = defenseMode === 'boxAndOne' || offense.length <= 2;
    document.getElementById('addBtn').disabled = defenseMode === 'boxAndOne' || offense.length >= 6;
  }

  // ---------------- drag handling ----------------
  function svgPoint(evt){
    const rect = svg.getBoundingClientRect();
    const scaleX = 880 / rect.width;
    const scaleY = 760 / rect.height;
    const px = (evt.clientX - rect.left) * scaleX;
    const py = (evt.clientY - rect.top) * scaleY;
    return toYd(px, py);
  }

  function attachDrag(g, idx){
    let dragging = false;
    let moved = false;
    let startClient = null;

    function onDown(evt){
      evt.preventDefault();
      dragging = true;
      moved = false;
      startClient = {x:evt.clientX, y:evt.clientY};
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    }
    function onMove(evt){
      if(!dragging) return;
      const d = Math.hypot(evt.clientX-startClient.x, evt.clientY-startClient.y);
      if(d > 3) moved = true;
      const yd = svgPoint(evt);
      yd.x = clamp(yd.x, FIELD_X[0]+0.5, FIELD_X[1]-0.5);
      yd.y = clamp(yd.y, FIELD_Y[0]+0.5, FIELD_Y[1]-0.5);
      // offensive players may not enter the crease
      const dGoal = dist(yd, GOAL);
      if(dGoal < CREASE_BUFFER){
        const dir = dGoal < 0.001 ? {x:0,y:1} : {x:(yd.x-GOAL.x)/dGoal, y:(yd.y-GOAL.y)/dGoal};
        yd.x = GOAL.x + dir.x*CREASE_BUFFER;
        yd.y = GOAL.y + dir.y*CREASE_BUFFER;
      }
      offense[idx] = yd;
      render();
    }
    function onUp(evt){
      dragging = false;
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      if(!moved){
        // treat as click -> give this player the ball
        ballIndex = idx;
        render();
      }
    }
    g.addEventListener('pointerdown', onDown);
  }

  // ---------------- controls ----------------
  function addAttacker(){
    offense.push({ x: (Math.random()*24-12), y: 6 + Math.random()*8 });
  }
  document.getElementById('addBtn').addEventListener('click', ()=>{
    if(defenseMode === 'boxAndOne') return; // fixed 6v5, no adjusting
    if(offense.length >= 6) return;
    addAttacker();
    render();
  });
  document.getElementById('removeBtn').addEventListener('click', ()=>{
    if(defenseMode === 'boxAndOne') return; // fixed 6v5, no adjusting
    if(offense.length <= 2) return;
    offense.pop();
    if(ballIndex >= offense.length) ballIndex = 0;
    render();
  });

  // ---------------- defense scheme menu ----------------
  const menuBtn = document.getElementById('menuBtn');
  const menuDropdown = document.getElementById('menuDropdown');
  const menuItems = document.querySelectorAll('.menu-item');

  function setMode(mode){
    defenseMode = mode;
    if(mode === 'boxAndOne'){
      // Box and 1 is always 6 attackers vs 5 defenders - no other scenario.
      while(offense.length < 6) addAttacker();
      while(offense.length > 6){ offense.pop(); }
      if(ballIndex >= offense.length) ballIndex = 0;
    }
    menuItems.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
    document.getElementById('modeLabel').textContent = mode === 'man' ? 'Man to Man' : 'Box and 1';
    render();
  }
  menuBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    menuDropdown.classList.toggle('open');
  });
  menuItems.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      setMode(btn.dataset.mode);
      menuDropdown.classList.remove('open');
    });
  });
  window.addEventListener('click', ()=>{ menuDropdown.classList.remove('open'); });

  buildField();
  setMode('man');

  // ---------------- fit-to-container sizing ----------------
  // Measures the real available space (works whether this page fills a browser
  // window or sits inside a Google Sites embed iframe) and sizes the field to
  // fit without ever needing a scrollbar.
  const appEl = document.querySelector('.app-minimal');
  const cardEl = document.querySelector('.field-card');
  const titleRowEl = document.querySelector('.field-title-row');
  const hintEl = document.querySelector('.hint');

  function fitField(){
    const padding = 32; // .app-minimal top+bottom padding
    const gaps = 20;    // margins around the title row and hint text
    const availableH = window.innerHeight - padding - titleRowEl.offsetHeight - hintEl.offsetHeight - gaps;
    const availableW = cardEl.clientWidth;

    const ratio = 880/760;
    let width = availableW;
    let height = width / ratio;
    if(height > availableH){
      height = Math.max(160, availableH);
      width = height * ratio;
    }
    svg.style.width = width + 'px';
    svg.style.height = height + 'px';
  }

  window.addEventListener('resize', fitField);
  window.addEventListener('load', fitField);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fitField); }
  if(window.ResizeObserver){ new ResizeObserver(fitField).observe(appEl); }
  fitField();
})();
</script>
</body>
